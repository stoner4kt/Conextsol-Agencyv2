name: Security branch validation

on:
  push:
    branches:
      - security/auth-and-access-hardening
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  validate-and-remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/auth-and-access-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile with approved overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix || true
      - name: Synchronize patched lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Reinstall updated lockfile
        run: npm ci
      - name: Run dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit dependency security updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix vulnerable transitive dependencies"
          git push origin HEAD:security/auth-and-access-hardening
